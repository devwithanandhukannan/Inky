<!doctype html><html><head><meta charset=utf-8><style>
:root{--bg:#fff;--fg:#1f2328;--muted:#59636e;--border:#d1d9e0;--canvas-subtle:#f6f8fa;--accent:#0969da}
body{margin:0;background:var(--bg);color:var(--fg);font:14px system-ui}
header{background:#24292f;color:#fff;padding:12px 16px}
.wrap{display:flex;gap:24px;padding:24px}
.box{border:1px solid var(--border);border-radius:6px;background:var(--bg);width:560px}
.box h3{margin:0;padding:12px 16px;background:var(--canvas-subtle);border-bottom:1px solid var(--border)}
.row{padding:10px 16px;border-top:1px solid var(--border);display:flex;justify-content:space-between}
.row:first-of-type{border-top:0}.muted{color:var(--muted)}
.label{background:#ddf4ff;color:#0550ae;border-radius:99px;padding:0 8px;font-size:12px}
.label.red{background:#ffebe9;color:#82071e}
pre{background:var(--canvas-subtle);padding:12px;border-radius:6px;margin:12px;overflow:auto}
code{background:rgba(129,139,152,.12);padding:2px 5px;border-radius:6px}
.btn{background:#f6f8fa;border:1px solid var(--border);padding:5px 12px;border-radius:6px;color:var(--fg)}
.btn.green{background:#1f883d;color:#fff;border-color:rgba(31,35,40,.15)}
a{color:var(--accent);text-decoration:none}
</style></head><body><header>GitHub-like <input placeholder="Search" style="background:#32383f;color:#fff;border:0;padding:4px 8px"></header>
<div class=wrap><div class=box><h3>Repository files</h3>
<div class=row><a href="#">src/index.js</a><span class=muted>2 days ago</span></div>
<div class=row><span>Fix bug <span class=label>bug</span> <span class="label red">urgent</span></span><span class=muted>5 hours ago</span></div>
<pre><code>npm install inky</code></pre><div class=row><button class=btn>Cancel</button><button class="btn green">Create</button></div></div></div></body></html>
