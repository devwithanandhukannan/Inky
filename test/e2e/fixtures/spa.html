<!doctype html><html><head><meta charset=utf-8><style>
body{margin:0;font:14px sans-serif;background:#fafafa;color:#333}
#root{padding:20px}.tile{background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);padding:12px;margin:8px 0;border-radius:8px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:grid;place-items:center}.modal>div{background:#fff;padding:24px;border-radius:12px;color:#111}
.tab{display:inline-block;padding:6px 12px;border-bottom:2px solid transparent}.tab.on{border-color:#0a84ff;color:#0a84ff}
.chip{background:#e8f0fe;color:#1967d2;padding:2px 8px;border-radius:12px}
.toast{position:fixed;bottom:16px;left:16px;background:#323232;color:#fff;padding:10px 16px;border-radius:4px}
my-card{display:block}
</style></head><body><div id=root><div><span class="tab on">Home</span><span class=tab>Files</span></div></div>
<script>
class MyCard extends HTMLElement{connectedCallback(){const r=this.attachShadow({mode:'open'});r.innerHTML='<style>.c{background:#fff;color:#222;padding:12px;border:1px solid #ddd;border-radius:8px}a{color:#0645ad}</style><div class=c>Shadow card <a href="#">link</a></div>'}}
customElements.define('my-card',MyCard);
setTimeout(()=>{const r=document.getElementById('root');r.insertAdjacentHTML('beforeend','<div class=tile>Dynamic tile <span class=chip>new</span></div><div class=tile style="background:#f1f3f4;color:#5f6368">Inline styled tile</div><my-card></my-card><div class=modal><div>Modal dialog <button>OK</button></div></div><div class=toast>Saved</div>')},600);
</script></body></html>
